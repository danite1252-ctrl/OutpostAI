[workspace]
resolver = "2"
members = [
    "crates/outpost-core",
    "crates/outpost-engines",
    "crates/outpost-gateway",
    "apps/desktop/src-tauri",
]
# `cargo test` / `cargo build` at the root skip the desktop shell, which needs
# the Tauri system dependencies. Build it with `npm run tauri build`.
default-members = ["crates/outpost-core", "crates/outpost-engines", "crates/outpost-gateway"]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.2"
# The encrypted port for phones: Outpost's own certificate, served with rustls (ring).
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The pairing QR code, drawn as SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Announces the Outpost on the home network so phones can find it.
mdns-sd = "0.13"
# Finding this PC's Tailscale address among its network interfaces.
if-addrs = "0.13"
# Checking a server update's signature (the same scheme as the desktop updater).
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
sysinfo = "0.33"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio-stream = "0.1"
# ComfyUI progress over its local websocket (plain ws://127.0.0.1, so no TLS).
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"

outpost-core = { path = "crates/outpost-core" }
outpost-engines = { path = "crates/outpost-engines" }
outpost-gateway = { path = "crates/outpost-gateway" }

# PIN hashing is deliberately slow; optimise it even in debug builds so sign-in
# and tests stay quick during development.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
