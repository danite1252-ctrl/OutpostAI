[package]
name = "outpost-gateway"
description = "Outpost local API gateway: one port for the desktop, phones and apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "outpost-gateway"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
axum = { workspace = true, features = ["multipart"] }
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
if-addrs.workspace = true
mdns-sd.workspace = true
minisign-verify.workspace = true
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio-rustls.workspace = true
tower.workspace = true
uuid.workspace = true
outpost-core.workspace = true
outpost-engines.workspace = true
qrcode.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["process", "io-std", "io-util", "fs", "time"] }
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true

[dev-dependencies]
http-body-util = "0.1"
