[package]
name = "outpost-desktop"
description = "Outpost desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "outpost_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
outpost-engines.workspace = true
outpost-gateway.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# Opening Outpost while it's in the tray shows the running one instead of starting another.
tauri-plugin-single-instance = "2"
# Installing a newer release after you press Update (the download's signature is checked).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri::generate_context! writes the plugins' settings (the updater's) as serde_json values.
serde_json.workspace = true
serde.workspace = true
# The tunnel to a server (when the app uses one instead of its own gateway).
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
